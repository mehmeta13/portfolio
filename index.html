  <header class="site-header">

  </header>

  <main class="home">
    <h1 class="sr-only">Mehmet Bacaksizlar — Engineering Projects</h1>
    <ul class="projects">
      <li class="project">
        <a href="projects/capstone.html">
          <span class="project__img">
            <img src="capstone-project-image.png" alt="Tacit Knowledge Capture" />
          </span>
          <span class="project__label">Tacit Knowledge Capture</span>
        </a>
        <div class="project__desc" data-text="A year-long Master of Engineering capstone on capturing the unwritten knowledge of machinists, where I designed a pilot that has a language model propose what forum experts take for granted and then tests each proposal against the rest of the corpus."></div>
      </li>

      <li class="project">
        <a href="projects/data-centers.html">
          <span class="project__img">
            <img src="data-centers-project-image.png" alt="Data Center Cooling" />
          </span>
          <span class="project__label">Data Center Cooling</span>
        </a>
        <div class="project__desc" data-text="Four models of how a data center moves heat, from the airflow through a server hall and a liquid-cooled cold plate under a 324 W chip to the glycol loop that carries the heat outside, built in Cadence Reality DC Design and Ansys Fluent."></div>
      </li>

      <li class="project">
        <a href="projects/ml.html">
          <span class="project__img">
            <img src="ml-project-image.png" alt="Machine Learning for Energy" />
          </span>
          <span class="project__label">Machine Learning for Energy</span>
        </a>
        <div class="project__desc" data-text="Neural networks and genetic algorithms fit to energy system data, from a network whose backpropagation I completed by hand to a deep network for a hybrid solar gas turbine and a sensitivity study of boiling in reduced gravity."></div>
      </li>

      <li class="project">
        <a href="projects/gantry.html">
          <span class="project__img">
            <img src="gantry-project-image.png" alt="Robotic Data Collection" />
          </span>
          <span class="project__label">Robotic Data Collection</span>
        </a>
        <div class="project__desc" data-text="An autonomous 2D scanning rig that moves a camera through a programmable grid to capture and log timestamped, position-tagged image datasets, built for long, unattended greenhouse and plant-monitoring experiments."></div>
      </li>

      <li class="project">
        <a href="projects/grocery-packing.html">
          <span class="project__img">
            <img src="grocery-packing-project-image.png" alt="Grocery Packing" />
          </span>
          <span class="project__label">Grocery Packing</span>
        </a>
        <div class="project__desc" data-text="An end-to-end robotic system that surveys, grasps, and packs common grocery items using computer vision and a custom SCARA-style manipulator, completing 404 of 425 autonomous pick-and-place actions (95.1%)."></div>
      </li>

      <li class="project">
        <a href="projects/masac.html">
          <span class="project__img">
            <img src="masac-project-image.png" alt="EV Charging" />
          </span>
          <span class="project__label">EV Charging</span>
        </a>
        <div class="project__desc" data-text="A multi-agent reinforcement learning framework that coordinates EV charging across a power distribution grid, balancing charging cost, battery targets, and voltage stability, with a GPU-accelerated power-flow solver running inside the training loop."></div>
      </li>
    </ul>
