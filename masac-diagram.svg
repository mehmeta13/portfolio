<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3cf0"/>
    </marker>
  </defs>

  <!-- SAC agents -->
  <g>
    <rect x="20" y="20" width="180" height="76" fill="#ffffff" stroke="#1a3cf0" stroke-width="1.5"/>
    <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">SAC Agent 1</text>
    <text x="110" y="64" text-anchor="middle" font-size="10.5" fill="#8a8a8a">actor &#183; 2 critics &#183; value</text>
    <text x="110" y="80" text-anchor="middle" font-size="10.5" fill="#8a8a8a">10 EVs / station</text>

    <rect x="260" y="20" width="180" height="76" fill="#ffffff" stroke="#1a3cf0" stroke-width="1.5"/>
    <text x="350" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">SAC Agent 2</text>
    <text x="350" y="64" text-anchor="middle" font-size="10.5" fill="#8a8a8a">actor &#183; 2 critics &#183; value</text>
    <text x="350" y="80" text-anchor="middle" font-size="10.5" fill="#8a8a8a">10 EVs / station</text>

    <rect x="500" y="20" width="180" height="76" fill="#ffffff" stroke="#1a3cf0" stroke-width="1.5"/>
    <text x="590" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">SAC Agent 3</text>
    <text x="590" y="64" text-anchor="middle" font-size="10.5" fill="#8a8a8a">actor &#183; 2 critics &#183; value</text>
    <text x="590" y="80" text-anchor="middle" font-size="10.5" fill="#8a8a8a">10 EVs / station</text>
  </g>

  <!-- agents <-> buffer -->
  <line x1="124" y1="104" x2="238" y2="158" stroke="#111111" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="350" y1="104" x2="350" y2="158" stroke="#111111" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="576" y1="104" x2="462" y2="158" stroke="#111111" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- replay buffer -->
  <rect x="150" y="164" width="400" height="62" fill="#f6f6f7" stroke="#111111" stroke-width="1.2"/>
  <text x="350" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Shared Prioritized Replay Buffer</text>
  <text x="350" y="210" text-anchor="middle" font-size="10.5" fill="#8a8a8a">experience sampling &#183; importance weights</text>

  <line x1="350" y1="226" x2="350" y2="282" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- charging environment -->
  <rect x="90" y="290" width="520" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="350" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Charging Environment &#8212; 30 EVs, 3 stations</text>
  <text x="350" y="338" text-anchor="middle" font-size="10.5" fill="#8a8a8a">5-min resolution &#183; 288 steps/day &#183; TOU pricing &#183; V2G discharge</text>
  <text x="350" y="356" text-anchor="middle" font-size="10.5" fill="#8a8a8a">actions: active + reactive power per EV (20-dim / agent)</text>

  <line x1="350" y1="374" x2="350" y2="430" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- GPU power-flow solver -->
  <rect x="90" y="438" width="520" height="66" fill="#ffffff" stroke="#1a3cf0" stroke-width="1.5"/>
  <text x="350" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">GPU Power-Flow Solver &#8212; IEEE 33-bus grid</text>
  <text x="350" y="486" text-anchor="middle" font-size="10.5" fill="#8a8a8a">batched PyTorch tensors &#183; 15&#8211;20&#215; faster than CPU</text>

  <line x1="350" y1="504" x2="350" y2="560" stroke="#111111" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- reward -->
  <rect x="90" y="568" width="520" height="62" fill="#f6f6f7" stroke="#111111" stroke-width="1.2"/>
  <text x="350" y="594" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">Multi-Objective Reward</text>
  <text x="350" y="614" text-anchor="middle" font-size="10.5" fill="#8a8a8a">economics + SoC achievement + voltage stability &#8722; penalties</text>

  <!-- feedback loop: reward -> agents -->
  <path d="M 610 599 C 664 599 664 570 664 500 L 664 180 C 664 140 640 120 622 104"
        fill="none" stroke="#1a3cf0" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
</svg>
